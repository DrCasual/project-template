# Runs on every pull request: checks only, nothing is pushed or deployed.
# Can also be started by hand: Actions → ci → Run workflow.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    if: ${{ !endsWith(github.repository, '/project-template') && (github.event.action == 'opened' || github.event.action == 'reopened') }}
    uses: DrCasual/devops-templates/.github/workflows/pr-labels.yml@v1

  # Remove the stacks this project doesn't use.
  python:
    if: ${{ !endsWith(github.repository, '/project-template') }}  # the template repo itself has no app to build
    uses: DrCasual/devops-templates/.github/workflows/ci-python.yml@v1
    with:
      python-version: "3.12"

  node:
    if: ${{ !endsWith(github.repository, '/project-template') }}  # the template repo itself has no app to build
    uses: DrCasual/devops-templates/.github/workflows/ci-node.yml@v1
    with:
      node-version: "20"
      working-directory: web

  image:
    if: ${{ !endsWith(github.repository, '/project-template') }}  # the template repo itself has no app to build
    uses: DrCasual/devops-templates/.github/workflows/docker-image.yml@v1
    with:
      smoke-command: bash deploy/smoke.sh
